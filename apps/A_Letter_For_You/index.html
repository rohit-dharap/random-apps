<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7eee7" />
    <meta name="description" content="तुझ्यासाठी मनापासून एक छोटीशी माफी आणि आपल्या आठवणी." />
    <title>माफ कर ना ❤️</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <section class="note" aria-labelledby="headline">
        <p class="to-you">माझ्या आवडत्या व्यक्तीसाठी ❤️</p>
        <h1 id="headline">माफ कर ना…</h1>
        <p>माझ्याकडून तुला दुखावलं गेलं, त्याबद्दल मनापासून माफ कर. तू माझ्यासाठी खूप खास आहेस आणि तुझ्यावर खूप प्रेम करतो. जेव्हा तुला वाटेल, तेव्हा आपण बोलू. मी तुझं ऐकायला आणि माझी चूक सुधारायला तयार आहे.</p>
      </section>

      <section class="memories" aria-labelledby="memories-title">
        <h2 id="memories-title">आपल्या आठवणी</h2>
        <div class="slideshow" aria-roledescription="carousel" aria-label="आपल्या आठवणींचे फोटो">
          <div class="photo-frame">
            <img id="memory-image" src="./resources/photo-placeholder.svg" alt="Photo placeholder 1" />
          </div>
          <p id="memory-caption" class="photo-caption" aria-live="polite">इथे आपला फोटो</p>
          <div class="slide-controls">
            <button id="previous" class="arrow" type="button" aria-label="Previous photo">←</button>
            <div id="slide-dots" class="dots" aria-label="Choose a photo"></div>
            <button id="next" class="arrow" type="button" aria-label="Next photo">→</button>
          </div>
          <p id="slide-status" class="sr-only" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
